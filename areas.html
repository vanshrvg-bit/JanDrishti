<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore Kanpur — Jan Drishti</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header" id="site-header"></header>

<section class="section-tight">
  <div class="wrap">
    <div class="section-head reveal in">
      <span class="eyebrow">Explore Areas</span>
      <h2>Explore Kanpur</h2>
      <p>Know your neighbourhood. Understand what needs attention — and what's already improving.</p>
    </div>

    <div class="card" style="padding:16px;margin-bottom:24px;">
      <div class="flex gap-12" style="flex-wrap:wrap;align-items:center;">
        <input id="searchBox" type="text" placeholder="Search locality..." style="flex:1;min-width:200px;border:1px solid var(--line);border-radius:var(--r-pill);padding:11px 18px;font-size:14.5px;font-family:inherit;background:var(--bg);">
      </div>
      <div class="flex gap-8 mt-12" id="catFilters" style="flex-wrap:wrap;"></div>
    </div>

    <div id="mapMini" class="card reveal in" style="padding:16px;margin-bottom:28px;height:420px;"></div>

    <div class="grid grid-3" id="areaGrid"></div>
    <p id="emptyState" class="muted small hidden" style="text-align:center;padding:40px 0;">No localities match your search. Try another name.</p>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>
<nav class="bottom-nav" id="bottom-nav"></nav>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/map.js"></script>
<script>
  renderChrome('areas');

  const filters = [["overall","Overall"],["roads","Roads"],["cleanliness","Cleanliness"],["water","Water"],["greenery","Greenery"],["lighting","Lighting"],["traffic","Traffic"]];
  const catFilters = document.getElementById('catFilters');
  catFilters.innerHTML = filters.map(([k,l],i)=>`<button class="btn btn-sm ${i===0?'btn-ghost':'btn-outline'}" data-f="${k}" style="padding:7px 13px;">${l}</button>`).join('');
  const mapApi = renderCivicMap(document.getElementById('mapMini'), { onSelect:(id)=> location.href = `area.html?id=${id}` });
  let activeFilter = 'overall';
  catFilters.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      catFilters.querySelectorAll('button').forEach(b=>{ b.classList.remove('btn-ghost'); b.classList.add('btn-outline'); });
      btn.classList.remove('btn-outline'); btn.classList.add('btn-ghost');
      activeFilter = btn.dataset.f;
      mapApi.setFilter(activeFilter);
      renderGrid();
    });
  });

  const grid = document.getElementById('areaGrid');
  const empty = document.getElementById('emptyState');
  function renderGrid(){
    const q = document.getElementById('searchBox').value.trim().toLowerCase();
    let list = AREAS.filter(a => a.name.toLowerCase().includes(q));
    if(activeFilter !== 'overall'){
      list = [...list].sort((a,b)=> b.categories[activeFilter] - a.categories[activeFilter]);
    }
    grid.innerHTML = list.map(areaCard).join('');
    empty.classList.toggle('hidden', list.length>0);
  }
  document.getElementById('searchBox').addEventListener('input', renderGrid);
  renderGrid();
  initReveal();
</script>
</body>
</html>
